<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fake users</title>
<link rel="icon" href="data:,">
<style>
body { font-family: system-ui, sans-serif; margin: 24px; color: #222; }
form { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 16px; }
input, select, button, .button { font: inherit; padding: 4px 10px; }
input { width: 140px; }
.button { border: 1px solid #999; border-radius: 4px; background: #f0f0f0; color: inherit; text-decoration: none; }
.disabled { pointer-events: none; opacity: 0.4; }
.table { overflow-x: auto; }
table { border-collapse: collapse; font-size: 14px; }
th, td { border-bottom: 1px solid #ddd; padding: 6px 10px; text-align: left; vertical-align: top; }
th { background: #f5f5f5; }
td:nth-child(11) { white-space: nowrap; }
</style>
</head>
<body>
<h1>Fake users</h1>
<form>
  <select name="locale" onchange="this.form.submit()">
    {% for c in countries %}
    <option value="{{ c.locale }}" {{ 'selected' if c.locale == locale }}>{{ c.country }}</option>
    {% endfor %}
  </select>
  <input type="number" name="seed" value="{{ seed }}">
  <button type="submit">Generate</button>
  <button type="button" onclick="this.form.seed.value = Math.floor(Math.random() * 1000000); this.form.submit()">Random seed</button>
  <a class="button {{ 'disabled' if page == 0 }}" href="{{ url_for('index', locale=locale, seed=seed, page=page - 1) }}">Previous</a>
  <span>Page {{ page + 1 }}</span>
  <a class="button" href="{{ url_for('index', locale=locale, seed=seed, page=page + 1) }}">Next</a>
</form>
<div class="table">
<table>
  <tr>
    <th>#</th><th>Name</th><th>Sex</th><th>Address</th><th>Latitude</th><th>Longitude</th>
    <th>Height, cm</th><th>Weight, kg</th><th>Eyes</th><th>Hair</th><th>Phone</th><th>Email</th>
  </tr>
  {% for user in users %}
  <tr>
    {% for value in user.values() %}<td>{{ value }}</td>{% endfor %}
  </tr>
  {% endfor %}
</table>
</div>
</body>
</html>
